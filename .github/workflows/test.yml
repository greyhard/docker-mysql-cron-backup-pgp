name: test

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout the code
        uses: actions/checkout@v5
      - name: Test Bash scripts
        run: sudo apt-get -qq update && sudo apt-get install -y devscripts shellcheck && make test
      - name: Test image
        # Builds the image, makes a PGP-encrypted backup against MariaDB from docker-compose.yaml,
        # decrypts and restores it, and waits for the container to report healthy
        run: ./test-image.sh
