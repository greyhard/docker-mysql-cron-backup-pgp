name: build docker image

# Release = push a version tag (e.g. `git tag 1.1 && git push origin 1.1`):
# the image is published to Docker Hub as both :<tag> and :latest
on:
  push:
    tags:
      - "[0-9]*"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the code
        uses: actions/checkout@v5
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: greyhard
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push multiarch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: |
            greyhard/docker-mysql-cron-backup-pgp:${{ github.ref_name }}
            greyhard/docker-mysql-cron-backup-pgp:latest
